name: Daily paper digest
on:
  schedule:
    - cron: '30 0 * * *' # 08:30 Asia/Shanghai
    - cron: '17 1,2 * * *' # Retry at 09:17 and 10:17 Asia/Shanghai
  workflow_dispatch:
    inputs:
      refresh_existing:
        description: Re-review existing papers without fetching new candidates
        type: boolean
        default: false
      refresh_today:
        description: Re-run selection for today (replaces today only)
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: paper-digest
  cancel-in-progress: false
jobs:
  digest:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Configure checkpoint commits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF parser
        run: python -m pip install -r requirements.txt
      - name: Fetch, select and render
        env:
          PUSH_REVIEW_CHECKPOINTS: 'true'
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          REFRESH_TODAY: ${{ inputs.refresh_today }}
          REFRESH_EXISTING: ${{ inputs.refresh_existing }}
        run: python digest.py
      - name: Save history
        run: |
          git add data site/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Update daily paper digest'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Wait for artifact availability
        run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v4
